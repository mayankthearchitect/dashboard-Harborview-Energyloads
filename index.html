<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harborview Tower - Load Profiles Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            background: #2b2b2b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            text-align: center;
        }

        .header h1 {
            color: #ffffff;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            color: #b0b0b0;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #2b2b2b;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-card h3 {
            color: #b0b0b0;
            font-size: 0.9em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .stat-card .value {
            font-size: 2.5em;
            font-weight: bold;
            margin-bottom: 5px;
            transition: all 0.3s ease;
        }

        .stat-card .value.updating {
            animation: pulse 0.5s ease;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .stat-card .unit {
            color: #b0b0b0;
            font-size: 0.9em;
        }

        .stat-card.heating {
            background: #dc3545;
        }

        .stat-card.heating h3,
        .stat-card.heating .unit {
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-card.heating .value {
            color: #ffffff;
        }

        .stat-card.cooling {
            background: #5bc0de;
        }

        .stat-card.cooling h3,
        .stat-card.cooling .unit {
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-card.cooling .value {
            color: #ffffff;
        }

        .stat-card.peak-heating {
            background: #A20202;
        }

        .stat-card.peak-heating h3,
        .stat-card.peak-heating .unit {
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-card.peak-heating .value {
            color: #ffffff;
        }

        .stat-card.peak-cooling {
            background: #0320FC;
        }

        .stat-card.peak-cooling h3,
        .stat-card.peak-cooling .unit {
            color: rgba(255, 255, 255, 0.8);
        }

        .stat-card.peak-cooling .value {
            color: #ffffff;
        }

        .chart-container {
            background: #2b2b2b;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
        }

        .chart-container h2 {
            color: #ffffff;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .chart-wrapper {
            position: relative;
            height: 400px;
        }

        .controls {
            background: #2b2b2b;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin-bottom: 30px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .controls label {
            color: #ffffff;
            font-weight: 600;
            margin-right: 10px;
        }

        .controls select {
            padding: 10px 15px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #1a1a1a;
            color: #ffffff;
            font-size: 1em;
            cursor: pointer;
            transition: border-color 0.3s ease;
        }

        .controls select:hover {
            border-color: #5bc0de;
        }

        .controls select:focus {
            outline: none;
            border-color: #5bc0de;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.5em;
            padding: 50px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .chart-wrapper {
                height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Harborview Tower - Energy Load Profiles</h1>
            <p>Heating and Cooling Load Analysis Dashboard</p>
        </div>

        <div id="loading" class="loading">Loading data...</div>

        <div id="content" style="display: none;">
            <div class="stats-grid">
                <div class="stat-card peak-heating">
                    <h3>Peak Heating Load</h3>
                    <div class="value" id="peakHeating">-</div>
                    <div class="unit">kBtu/h</div>
                </div>
                <div class="stat-card peak-cooling">
                    <h3>Peak Cooling Load</h3>
                    <div class="value" id="peakCooling">-</div>
                    <div class="unit">kBtu/h</div>
                </div>
                <div class="stat-card heating">
                    <h3>Avg Heating Load</h3>
                    <div class="value" id="avgHeating">-</div>
                    <div class="unit">kBtu/h</div>
                </div>
                <div class="stat-card cooling">
                    <h3>Avg Cooling Load</h3>
                    <div class="value" id="avgCooling">-</div>
                    <div class="unit">kBtu/h</div>
                </div>
            </div>

            <div class="controls">
                <label for="chartType">Chart Type:</label>
                <select id="chartType">
                    <option value="line">Line Chart</option>
                    <option value="bar">Bar Chart</option>
                    <option value="area">Area Chart</option>
                </select>

                <label for="dataRange">Date Range:</label>
                <select id="dataRange">
                    <option value="all">All Year (8,760 hours)</option>
                    <option value="week1">Week 1 (Jan 1-7)</option>
                    <option value="week2">Week 2 (Jan 8-14)</option>
                    <option value="jan">January</option>
                    <option value="feb">February</option>
                    <option value="mar">March</option>
                    <option value="apr">April</option>
                    <option value="may">May</option>
                    <option value="jun">June</option>
                    <option value="jul">July</option>
                    <option value="aug">August</option>
                    <option value="sep">September</option>
                    <option value="oct">October</option>
                    <option value="nov">November</option>
                    <option value="dec">December</option>
                    <option value="q1">Q1 (Jan-Mar)</option>
                    <option value="q2">Q2 (Apr-Jun)</option>
                    <option value="q3">Q3 (Jul-Sep)</option>
                    <option value="q4">Q4 (Oct-Dec)</option>
                    <option value="summer">Summer (Jun-Aug)</option>
                    <option value="winter">Winter (Dec-Feb)</option>
                </select>
            </div>

            <div class="chart-container">
                <h2>Load Profile Over Time</h2>
                <div class="chart-wrapper">
                    <canvas id="loadChart"></canvas>
                </div>
            </div>

            <div class="chart-container">
                <h2>Heating vs Cooling Load Distribution</h2>
                <div class="chart-wrapper">
                    <canvas id="distributionChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let loadData = [];
        let mainChart = null;
        let distributionChart = null;

        // Load JSON data
        fetch('load_data.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                return response.json();
            })
            .then(data => {
                processData(data);
            })
            .catch(error => {
                console.error('Error loading data:', error);
                document.getElementById('loading').innerHTML =
                    'Error loading data. Please run a local server:<br>' +
                    '<code style="background: rgba(255,255,255,0.2); padding: 10px; display: inline-block; margin-top: 10px; border-radius: 5px;">' +
                    'python3 -m http.server 8000</code><br>' +
                    '<span style="font-size: 0.9em; margin-top: 10px; display: inline-block;">Then open: http://localhost:8000/dashboard.html</span>';
            });

        function processData(data) {
            loadData = data.map(d => ({
                date: d.date,
                time: d.time,
                heating: d.heating,
                cooling: d.cooling,
                dateTime: `${d.date} ${d.time}`
            }));

            console.log(`Loaded ${loadData.length} data points`);
            updateStats();
            createCharts();

            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            // Add event listeners
            document.getElementById('chartType').addEventListener('change', updateMainChart);
            document.getElementById('dataRange').addEventListener('change', updateDashboard);
        }

        function updateStats(data = loadData) {
            const heating = data.map(d => d.heating);
            const cooling = data.map(d => d.cooling);

            const peakHeating = Math.max(...heating);
            const peakCooling = Math.max(...cooling);
            const avgHeating = heating.reduce((a, b) => a + b, 0) / heating.length;
            const avgCooling = cooling.reduce((a, b) => a + b, 0) / cooling.length;

            // Add animation class and update values
            const statElements = ['peakHeating', 'peakCooling', 'avgHeating', 'avgCooling'];
            statElements.forEach(id => {
                const element = document.getElementById(id);
                element.classList.add('updating');
                setTimeout(() => element.classList.remove('updating'), 500);
            });

            document.getElementById('peakHeating').textContent = peakHeating.toFixed(1);
            document.getElementById('peakCooling').textContent = peakCooling.toFixed(1);
            document.getElementById('avgHeating').textContent = avgHeating.toFixed(1);
            document.getElementById('avgCooling').textContent = avgCooling.toFixed(1);
        }

        function updateDashboard() {
            // Get the raw filtered data (before sampling for chart performance)
            const rawFilteredData = getRawFilteredData();

            // Update stats with the full filtered data (no sampling)
            updateStats(rawFilteredData);

            // Update the chart
            updateMainChart();
        }

        function getRawFilteredData() {
            const range = document.getElementById('dataRange').value;
            let filteredData = loadData;

            // Same logic as getFilteredData but without sampling
            const hoursPerDay = 24;
            const monthStarts = {
                'jan': 0,
                'feb': 31 * hoursPerDay,
                'mar': 59 * hoursPerDay,
                'apr': 90 * hoursPerDay,
                'may': 120 * hoursPerDay,
                'jun': 151 * hoursPerDay,
                'jul': 181 * hoursPerDay,
                'aug': 212 * hoursPerDay,
                'sep': 243 * hoursPerDay,
                'oct': 273 * hoursPerDay,
                'nov': 304 * hoursPerDay,
                'dec': 334 * hoursPerDay
            };

            const monthDays = {
                'jan': 31, 'feb': 28, 'mar': 31, 'apr': 30, 'may': 31, 'jun': 30,
                'jul': 31, 'aug': 31, 'sep': 30, 'oct': 31, 'nov': 30, 'dec': 31
            };

            switch(range) {
                case 'week1':
                    filteredData = loadData.slice(0, 7 * hoursPerDay);
                    break;
                case 'week2':
                    filteredData = loadData.slice(7 * hoursPerDay, 14 * hoursPerDay);
                    break;

                // Individual months
                case 'jan':
                case 'feb':
                case 'mar':
                case 'apr':
                case 'may':
                case 'jun':
                case 'jul':
                case 'aug':
                case 'sep':
                case 'oct':
                case 'nov':
                case 'dec':
                    const start = monthStarts[range];
                    const end = start + (monthDays[range] * hoursPerDay);
                    filteredData = loadData.slice(start, end);
                    break;

                // Quarters
                case 'q1':
                    filteredData = loadData.slice(monthStarts['jan'], monthStarts['apr']);
                    break;
                case 'q2':
                    filteredData = loadData.slice(monthStarts['apr'], monthStarts['jul']);
                    break;
                case 'q3':
                    filteredData = loadData.slice(monthStarts['jul'], monthStarts['oct']);
                    break;
                case 'q4':
                    filteredData = loadData.slice(monthStarts['oct'], loadData.length);
                    break;

                // Seasons
                case 'summer':
                    filteredData = loadData.slice(monthStarts['jun'], monthStarts['sep']);
                    break;
                case 'winter':
                    const decData = loadData.slice(monthStarts['dec'], loadData.length);
                    const janFebData = loadData.slice(monthStarts['jan'], monthStarts['mar']);
                    filteredData = [...decData, ...janFebData];
                    break;

                default:
                    filteredData = loadData;
            }

            return filteredData;
        }

        function getFilteredData() {
            const range = document.getElementById('dataRange').value;
            let filteredData = loadData;

            // Approximate hours per month (assuming 365 days, 24 hours/day)
            const hoursPerDay = 24;
            const monthStarts = {
                'jan': 0,
                'feb': 31 * hoursPerDay,
                'mar': 59 * hoursPerDay,
                'apr': 90 * hoursPerDay,
                'may': 120 * hoursPerDay,
                'jun': 151 * hoursPerDay,
                'jul': 181 * hoursPerDay,
                'aug': 212 * hoursPerDay,
                'sep': 243 * hoursPerDay,
                'oct': 273 * hoursPerDay,
                'nov': 304 * hoursPerDay,
                'dec': 334 * hoursPerDay
            };

            const monthDays = {
                'jan': 31, 'feb': 28, 'mar': 31, 'apr': 30, 'may': 31, 'jun': 30,
                'jul': 31, 'aug': 31, 'sep': 30, 'oct': 31, 'nov': 30, 'dec': 31
            };

            switch(range) {
                case 'week1':
                    filteredData = loadData.slice(0, 7 * hoursPerDay);
                    break;
                case 'week2':
                    filteredData = loadData.slice(7 * hoursPerDay, 14 * hoursPerDay);
                    break;

                // Individual months
                case 'jan':
                case 'feb':
                case 'mar':
                case 'apr':
                case 'may':
                case 'jun':
                case 'jul':
                case 'aug':
                case 'sep':
                case 'oct':
                case 'nov':
                case 'dec':
                    const start = monthStarts[range];
                    const end = start + (monthDays[range] * hoursPerDay);
                    filteredData = loadData.slice(start, end);
                    break;

                // Quarters
                case 'q1':
                    filteredData = loadData.slice(monthStarts['jan'], monthStarts['apr']);
                    break;
                case 'q2':
                    filteredData = loadData.slice(monthStarts['apr'], monthStarts['jul']);
                    break;
                case 'q3':
                    filteredData = loadData.slice(monthStarts['jul'], monthStarts['oct']);
                    break;
                case 'q4':
                    filteredData = loadData.slice(monthStarts['oct'], loadData.length);
                    break;

                // Seasons
                case 'summer':
                    filteredData = loadData.slice(monthStarts['jun'], monthStarts['sep']);
                    break;
                case 'winter':
                    // Dec + Jan + Feb (wraps around year)
                    const decData = loadData.slice(monthStarts['dec'], loadData.length);
                    const janFebData = loadData.slice(monthStarts['jan'], monthStarts['mar']);
                    filteredData = [...decData, ...janFebData];
                    break;

                default:
                    filteredData = loadData;
            }

            // Sample data if too many points for better performance
            if (filteredData.length > 500) {
                const step = Math.ceil(filteredData.length / 500);
                filteredData = filteredData.filter((_, index) => index % step === 0);
            }

            return filteredData;
        }

        function createCharts() {
            createMainChart();
            createDistributionChart();
        }

        function createMainChart() {
            const filteredData = getFilteredData();
            const labels = filteredData.map(d => d.dateTime);
            const chartType = document.getElementById('chartType').value;

            const config = {
                type: chartType === 'area' ? 'line' : chartType,
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Heating Load (kBtu/h)',
                            data: filteredData.map(d => d.heating),
                            borderColor: '#dc3545',
                            backgroundColor: chartType === 'area' ? 'rgba(220, 53, 69, 0.2)' : 'rgba(220, 53, 69, 0.5)',
                            fill: chartType === 'area',
                            tension: 0.4
                        },
                        {
                            label: 'Cooling Load (kBtu/h)',
                            data: filteredData.map(d => d.cooling),
                            borderColor: '#5bc0de',
                            backgroundColor: chartType === 'area' ? 'rgba(91, 192, 222, 0.2)' : 'rgba(91, 192, 222, 0.5)',
                            fill: chartType === 'area',
                            tension: 0.4
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: {
                        mode: 'index',
                        intersect: false,
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: '#ffffff',
                                font: {
                                    size: 12
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return context.dataset.label + ': ' + context.parsed.y.toFixed(2) + ' kBtu/h';
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            display: true,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            title: {
                                display: true,
                                text: 'Date & Time',
                                color: '#ffffff'
                            },
                            ticks: {
                                maxRotation: 45,
                                minRotation: 45,
                                autoSkip: true,
                                maxTicksLimit: 20,
                                color: '#b0b0b0'
                            }
                        },
                        y: {
                            display: true,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            title: {
                                display: true,
                                text: 'Load (kBtu/h)',
                                color: '#ffffff'
                            },
                            ticks: {
                                color: '#b0b0b0'
                            }
                        }
                    }
                }
            };

            if (mainChart) {
                mainChart.destroy();
            }

            const ctx = document.getElementById('loadChart');
            mainChart = new Chart(ctx, config);
        }

        function updateMainChart() {
            createMainChart();
        }

        function createDistributionChart() {
            const ctx = document.getElementById('distributionChart');

            // Categorize data by season
            const winter = [];
            const spring = [];
            const summer = [];
            const fall = [];

            loadData.forEach((d, index) => {
                const point = {x: d.heating, y: d.cooling};

                // Approximate month based on index (24 hours/day * ~30 days/month)
                const monthIndex = Math.floor(index / (24 * 30.4));

                // Winter: Dec (11), Jan (0), Feb (1)
                if (monthIndex === 11 || monthIndex === 0 || monthIndex === 1) {
                    winter.push(point);
                }
                // Spring: Mar (2), Apr (3), May (4)
                else if (monthIndex >= 2 && monthIndex <= 4) {
                    spring.push(point);
                }
                // Summer: Jun (5), Jul (6), Aug (7)
                else if (monthIndex >= 5 && monthIndex <= 7) {
                    summer.push(point);
                }
                // Fall: Sep (8), Oct (9), Nov (10)
                else {
                    fall.push(point);
                }
            });

            const config = {
                type: 'scatter',
                data: {
                    datasets: [
                        {
                            label: 'Winter (Dec-Feb)',
                            data: winter,
                            backgroundColor: 'rgba(91, 192, 222, 0.6)',
                            borderColor: '#5bc0de',
                            pointRadius: 3,
                            pointHoverRadius: 5
                        },
                        {
                            label: 'Spring (Mar-May)',
                            data: spring,
                            backgroundColor: 'rgba(76, 175, 80, 0.6)',
                            borderColor: '#4caf50',
                            pointRadius: 3,
                            pointHoverRadius: 5
                        },
                        {
                            label: 'Summer (Jun-Aug)',
                            data: summer,
                            backgroundColor: 'rgba(255, 152, 0, 0.6)',
                            borderColor: '#ff9800',
                            pointRadius: 3,
                            pointHoverRadius: 5
                        },
                        {
                            label: 'Fall (Sep-Nov)',
                            data: fall,
                            backgroundColor: 'rgba(156, 39, 176, 0.6)',
                            borderColor: '#9c27b0',
                            pointRadius: 3,
                            pointHoverRadius: 5
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                color: '#ffffff',
                                font: {
                                    size: 12
                                },
                                usePointStyle: true,
                                padding: 15
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const season = context.dataset.label;
                                    return `${season}: Heating ${context.parsed.x.toFixed(0)} kBtu/h, Cooling ${context.parsed.y.toFixed(0)} kBtu/h`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            title: {
                                display: true,
                                text: 'Heating Load (kBtu/h)',
                                color: '#ffffff'
                            },
                            ticks: {
                                color: '#b0b0b0'
                            }
                        },
                        y: {
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            title: {
                                display: true,
                                text: 'Cooling Load (kBtu/h)',
                                color: '#ffffff'
                            },
                            ticks: {
                                color: '#b0b0b0'
                            }
                        }
                    }
                }
            };

            distributionChart = new Chart(ctx, config);
        }
    </script>
</body>
</html>
